query PreflightRecordOcaDecision($input: RecordOcaDecisionInput!) {
  preflightRecordOcaDecision(input: $input) { allowed code recordType recordId currentVersion currentSha256 actorAssignmentId actorAssignmentVersion nextSafeAction }
}
mutation RecordOcaDecision($input: RecordOcaDecisionInput!) {
  recordOcaDecision(input: $input) { status replayed recordType recordId recordVersion receiptId nextSafeAction correlationId preflight { allowed code recordType recordId currentVersion currentSha256 actorAssignmentId actorAssignmentVersion nextSafeAction } }
}
