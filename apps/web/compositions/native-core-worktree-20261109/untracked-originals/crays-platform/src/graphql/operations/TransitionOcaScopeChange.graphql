query PreflightApproveOcaScopeChange($input: TransitionOcaScopeChangeInput!) {
  preflightApproveOcaScopeChange(input: $input) { allowed code recordType recordId currentVersion currentSha256 actorAssignmentId actorAssignmentVersion nextSafeAction }
}
mutation ApproveOcaScopeChange($input: TransitionOcaScopeChangeInput!) {
  approveOcaScopeChange(input: $input) { status replayed recordType recordId recordVersion receiptId nextSafeAction correlationId preflight { allowed code recordType recordId currentVersion currentSha256 actorAssignmentId actorAssignmentVersion nextSafeAction } }
}
